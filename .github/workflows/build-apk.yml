name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'iso.html'
      - 'voxel.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - 'src/**'
      - 'vendor/**'
      # tools/ 与 package.json 也得算进来：启动门禁就在 tools/ 下，
      # 门禁自身改了却不出包的话，产物会一直停在门禁坏掉之前那一次
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 启动门禁：真把 2.5D 入口跑起来再跑几帧。语法过了不等于跑得起来，
      # 曾经有一次掉进暂时性死区，模块一加载就抛，整页黑屏 —— 这道门就是拦它的
      - name: boot check
        run: node tools/boot-check.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: sync web assets
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          for f in index.html iso.html voxel.html manifest.json sw.js icon.svg; do
            cp "$f" android/app/src/main/assets/
          done
          rsync -a --delete src vendor android/app/src/main/assets/
          ls -1 android/app/src/main/assets

      - name: build
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: collect
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: yunshan-apk
          path: out/*.apk
          if-no-files-found: error
