<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云山录 · 山水长卷（2.5D 45°俯视）</title>
<style>
  :root {
    --ink: #12161d; --panel: rgba(16,20,28,.82); --gold: #e8c07a;
    --jade: #8fc7a8; --paper: #e8e2d2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; }
  body {
    font-family: "Courier New", Consolas, "Microsoft YaHei", monospace;
    color: #f2e9dc; user-select: none;
  }
  #map {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: grab; display: block;
  }
  #map:active { cursor: grabbing; }
  #hud {
    position: absolute; left: 14px; top: 14px; min-width: 210px;
    background: var(--panel); border: 2px solid rgba(232,192,122,.45);
    padding: 9px 12px; font-size: 12px; line-height: 1.9;
    box-shadow: 0 0 0 2px rgba(0,0,0,.35);
  }
  #hud .k { color: var(--gold); }
  #hud .v { color: #f2e9dc; }
  #prog {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--gold); padding: 5px 14px;
    font-size: 12px; display: none;
  }
  #tip {
    position: absolute; left: 14px; bottom: 14px; font-size: 11px;
    background: var(--panel); border: 1px solid rgba(232,192,122,.3);
    padding: 8px 12px; line-height: 1.9; color: #cfd8e3;
  }
  #tip b { color: var(--gold); font-weight: normal; }
  a.back { color: var(--jade); }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div><span class="k">坐标</span> <span class="v" id="coord">0, 0</span></div>
  <div><span class="k">视野</span> <span class="v" id="zoom">长卷 · 1×</span></div>
  <div><span class="k">时辰</span> <span class="v" id="clock">--:--</span></div>
  <div><span class="k">种子</span> <span class="v" id="seed">-</span></div>
  <div><span class="k">帧率</span> <span class="v" id="perf">-- FPS</span></div>
</div>

<div id="prog">绘制山水长卷 0%</div>

<div id="tip">
  <b>拖动</b> 漫游 · <b>滚轮</b> 缩放 · <b>WASD</b> 平移 · <b>R</b> 回到中心<br>
  整图 8000 × 8000 格，45° 等距投影，最小像素格<br>
  <a class="back" href="./index.html">← 回到 3D 体素版</a>
</div>

<script type="module" src="./src/iso/main2d.js"></script>
</body>
</html>
