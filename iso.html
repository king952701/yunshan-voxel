<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云山录 · 山水长卷（2.5D 45°俯视）</title>
<style>
  :root {
    --ink: #12161d; --panel: rgba(16,20,28,.82); --gold: #e8c07a;
    --jade: #8fc7a8; --paper: #e8e2d2; --line: rgba(232,192,122,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; }
  body {
    font-family: "Courier New", Consolas, "Microsoft YaHei", monospace;
    color: #f2e9dc; user-select: none;
  }
  #map {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: grab; display: block;
  }
  #map:active { cursor: grabbing; }
  .panel {
    background: var(--panel); border: 2px solid var(--line);
    box-shadow: 0 0 0 2px rgba(0,0,0,.35);
  }
  #hud {
    position: absolute; left: 14px; top: 14px; min-width: 210px;
    padding: 9px 12px; font-size: 12px; line-height: 1.9;
  }
  #hud .k { color: var(--gold); }
  #prog, #toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    padding: 5px 14px; font-size: 12px; display: none;
  }
  #prog { top: 18px; background: var(--panel); border: 1px solid var(--gold); }
  #toast { top: 56px; background: rgba(16,20,28,.9); border: 1px solid var(--jade); color: var(--jade); }
  #tip {
    position: absolute; left: 14px; bottom: 14px; font-size: 11px;
    background: var(--panel); border: 1px solid var(--line);
    padding: 8px 12px; line-height: 1.9; color: #cfd8e3;
  }
  #tip b { color: var(--gold); font-weight: normal; }
  a.back { color: var(--jade); }

  /* ---- 行囊 ---- */
  #bagwrap {
    position: absolute; right: 14px; top: 14px; width: 208px;
    padding: 8px 10px; font-size: 12px;
  }
  #bagwrap h3 { margin: 0 0 6px; font-size: 12px; color: var(--gold); font-weight: normal; }
  #bag { max-height: 46vh; overflow-y: auto; }
  .slot {
    display: flex; align-items: center; gap: 6px; padding: 3px 4px;
    cursor: pointer; border: 1px solid transparent;
  }
  .slot:hover { background: rgba(232,192,122,.12); }
  .slot.on { border-color: var(--gold); background: rgba(232,192,122,.16); }
  .slot i { width: 10px; height: 10px; flex: 0 0 10px; border: 1px solid rgba(0,0,0,.5); }
  .slot span { flex: 1; }
  .slot b { color: var(--gold); font-weight: normal; }
  .empty { color: #8b8b8b; padding: 4px; }

  /* ---- 合成 ---- */
  #craft {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(680px, 92vw); max-height: 76vh; display: none;
    padding: 12px 14px; font-size: 12px;
  }
  #craft h3 { margin: 0 0 8px; font-size: 13px; color: var(--gold); font-weight: normal; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  #tabs button {
    font: inherit; font-size: 11px; padding: 3px 9px; cursor: pointer;
    color: #cfd8e3; background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
  }
  #tabs button.on { background: rgba(232,192,122,.22); color: var(--gold); }
  #craft-body { max-height: 58vh; overflow-y: auto; }
  .row {
    display: grid; grid-template-columns: 150px 1fr 108px; gap: 8px;
    padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer;
  }
  .row:hover { background: rgba(232,192,122,.12); }
  .row.off { opacity: .45; }
  .row .out i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border: 1px solid rgba(0,0,0,.5); }
  .row .in { color: #b9c3cf; }
  .row .tip { color: var(--jade); font-size: 11px; }

  /* ---- 设置菜单与内置数据库 ---- */
  #gear {
    position: absolute; right: 14px; bottom: 14px; font: inherit; font-size: 12px;
    padding: 6px 12px; cursor: pointer; color: var(--gold);
    background: var(--panel); border: 1px solid var(--line);
  }
  #gear:hover { background: rgba(232,192,122,.18); }
  .menu-wrap {
    position: absolute; inset: 0; background: rgba(6,9,14,.72); z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  .menu {
    width: min(900px, 94vw); height: min(620px, 88vh); background: var(--panel);
    border: 2px solid var(--line); display: flex; flex-direction: column; font-size: 12px;
  }
  .menu-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--gold);
  }
  .menu-head .mx {
    font: inherit; cursor: pointer; color: #f2e9dc; background: transparent;
    border: 1px solid var(--line); padding: 1px 7px;
  }
  .menu-tabs { display: flex; gap: 6px; padding: 8px 12px 0; }
  .menu-tabs button, .cats button, .btns button {
    font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer;
    color: #cfd8e3; background: rgba(255,255,255,.06); border: 1px solid var(--line);
  }
  .menu-tabs button.on, .cats button.on, .btns button.on {
    background: rgba(232,192,122,.22); color: var(--gold);
  }
  .menu-body { flex: 1; overflow: hidden; padding: 10px 12px 12px; }
  .pane { height: 100%; overflow: hidden; }
  .pane[data-pane="help"] { display: flex; gap: 10px; }
  .help-left { width: 46%; display: flex; flex-direction: column; gap: 6px; }
  .help-right {
    flex: 1; border-left: 1px solid rgba(255,255,255,.1);
    padding-left: 10px; overflow-y: auto;
  }
  .search {
    font: inherit; font-size: 12px; padding: 5px 8px; width: 100%;
    color: #f2e9dc; background: rgba(255,255,255,.06); border: 1px solid var(--line);
  }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .entries { flex: 1; overflow-y: auto; border: 1px solid rgba(255,255,255,.08); }
  .entry { display: flex; align-items: center; gap: 6px; padding: 3px 6px; cursor: pointer; }
  .entry:hover { background: rgba(232,192,122,.12); }
  .entry.on { background: rgba(232,192,122,.2); }
  .entry i { width: 9px; height: 9px; flex: 0 0 9px; border: 1px solid rgba(0,0,0,.5); }
  .entry .s { flex: 1; color: #8b93a0; font-size: 11px; text-align: right; }
  .detail h3 {
    margin: 0 0 6px; font-size: 13px; color: var(--gold); font-weight: normal;
    display: flex; align-items: center; gap: 6px;
  }
  .detail h3 i { width: 10px; height: 10px; border: 1px solid rgba(0,0,0,.5); }
  .detail .sub { color: #b9c3cf; margin-bottom: 8px; }
  .detail .body { line-height: 1.9; color: #e6dccd; }
  .pane .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: default; grid-template-columns: none;
  }
  .pane .row:hover { background: transparent; }
  .btns { display: flex; gap: 4px; }
  .note { color: #8b93a0; font-size: 11px; line-height: 1.8; }
  .pane[data-pane="about"] p { line-height: 2; }
  .pane[data-pane="about"] a { color: var(--jade); }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud" class="panel">
  <div><span class="k">坐标</span> <span id="coord">0, 0</span></div>
  <div><span class="k">视野</span> <span id="zoom">长卷 · 1×</span></div>
  <div><span class="k">时辰</span> <span id="clock">--:--</span></div>
  <div><span class="k">种子</span> <span id="seed">-</span></div>
  <div><span class="k">镐</span> <span id="pick">空手</span></div>
  <div><span class="k">采矿</span> <span id="skill">1 级</span></div>
  <div><span class="k">矿脉</span> <span id="vein">—</span></div>
  <div><span class="k">帧率</span> <span id="perf">-- FPS</span></div>
</div>

<div id="bagwrap" class="panel">
  <h3>行囊 · 当前建材 <b id="mat" style="color:#e8c07a">青砖</b></h3>
  <div id="bag"></div>
</div>

<div id="craft" class="panel">
  <h3>百工谱 · 五十式（点一条即可合成）</h3>
  <div id="tabs"></div>
  <div id="craft-body"></div>
</div>

<div id="prog">绘制山水长卷 0%</div>
<div id="toast"></div>

<div id="tip">
  <b>拖动</b> 漫游 · <b>滚轮</b> 缩放 · <b>WASD</b> 平移 · <b>R</b> 回中心 · <b>C</b> 开合成<br>
  <b>左键</b> 掘土开采 · <b>右键</b> 垒建材 · <b>1~9</b> 换建材（须先放大到近景）<br>
  <b>E</b> 采矿脉：靠近露头按 E，5 秒进度条，技能与镐越快越省时；采空 5 分钟后自行复生<br>
  <b>Esc</b> 或右下角齿轮：设置与帮助（内含数据库，可按名称搜索）<br>
  整图 8000 × 8000 格，45° 等距投影，最小像素格<br>
  <a class="back" href="./index.html">← 回到 3D 体素版</a>
</div>

<button id="gear">⚙ 设置与帮助</button>

<script type="module" src="./src/iso/main2d.js"></script>
</body>
</html>
