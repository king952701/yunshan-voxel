plugins {
  id 'com.android.application'
}

android {
  namespace 'com.yunshan.voxel'
  compileSdk 34

  defaultConfig {
    applicationId 'com.yunshan.voxel'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      // 未配签名，产出 app-release-unsigned.apk；debug 包可直接安装
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // html / js / json 不压缩：WebView 直接从 assets 读，压缩反而添乱
  androidResources {
    noCompress 'html', 'js', 'mjs', 'json', 'svg'
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.10.0'
}
